name: Backend Staging Deployment & Automation

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Backend Git commit SHA or branch to deploy (e.g., develop or a specific commit)"
        required: true
        default: "develop"
      force_deploy:
        description: "Force rebuild and redeploy even if target image exists in ECR"
        type: boolean
        default: false
  repository_dispatch:
    types: [backend-deploy]

permissions:
  contents: read

concurrency:
  group: staging-backend-deployment
  cancel-in-progress: false

jobs:
  deploy-backend-staging:
    name: Deploy Backend to AWS App Runner (Staging)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25

    steps:
      - name: Resolve and validate target deployment revision
        id: resolve-ref
        env:
          INPUT_REF: ${{ github.event.inputs.backend_ref }}
          PAYLOAD_COMMIT: ${{ github.event.client_payload.commit_sha }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
        run: |
          TARGET="${INPUT_REF:-${PAYLOAD_COMMIT:-${PAYLOAD_REF:-develop}}}"
          # Strip surrounding whitespace
          TARGET=$(echo "${TARGET}" | tr -d '[:space:]')
          
          # Finding 4: Security input validation against malicious shell injection
          if [[ ! "${TARGET}" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::Invalid deployment target reference '${TARGET}'. Only alphanumeric characters, dots, underscores, slashes, and hyphens are allowed."
            exit 1
          fi

          echo "target_ref=${TARGET}" >> $GITHUB_OUTPUT
          echo "Resolved deployment target reference: ${TARGET}"

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate staging environment contract and deployment scripts
        run: |
          cd infra
          node --test tests/staging-baseline.test.cjs
          node --test tests/backend-staging-deploy.test.cjs

      - name: Checkout backend source repository
        uses: actions/checkout@v4
        with:
          repository: darshana-opticals-osms/backend
          ref: ${{ steps.resolve-ref.outputs.target_ref }}
          token: ${{ secrets.BACKEND_REPO_ACCESS_TOKEN || github.token }}
          path: backend

      - name: Compute commit-traceable immutable image tag
        id: image-tag
        run: |
          cd backend
          COMMIT_SHA=$(git rev-parse --short=8 HEAD)
          FULL_COMMIT_SHA=$(git rev-parse HEAD)
          TAG="staging-${COMMIT_SHA}"
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "full_commit_sha=${FULL_COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Computed immutable ECR tag: ${TAG} (from commit ${COMMIT_SHA})"

      - name: Verify Backend CI status gate (AC7 / AC8 / Finding 1)
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_ACCESS_TOKEN || github.token }}
          FULL_SHA: ${{ steps.image-tag.outputs.full_commit_sha }}
        run: |
          echo "Checking CI test verification for backend commit: ${FULL_SHA}..."
          
          # Query GitHub Check Runs API for the target commit in darshana-opticals-osms/backend
          STATUS_JSON=$(gh api "repos/darshana-opticals-osms/backend/commits/${FULL_SHA}/check-runs" 2>/dev/null)
          API_STATUS=$?
          
          if [ $API_STATUS -ne 0 ] || [ -z "${STATUS_JSON}" ]; then
            echo "::error::Failed to query GitHub Check Runs API for commit ${FULL_SHA}. Deployment aborted per fail-closed requirement (AC8)."
            exit 1
          fi

          TOTAL_COUNT=$(echo "${STATUS_JSON}" | jq -r '.total_count // 0')
          if [ "${TOTAL_COUNT}" -eq 0 ]; then
            echo "::error::No verified GitHub check runs found for backend commit ${FULL_SHA}. Deployment rejected per AC8 (unverified revisions cannot be deployed)."
            exit 1
          fi

          # Require explicit completed status and successful conclusion for backend checks
          SUCCESS_COUNT=$(echo "${STATUS_JSON}" | jq -r '[.check_runs[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped"))] | length')
          NON_SUCCESS_COUNT=$(echo "${STATUS_JSON}" | jq -r '[.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length')

          if [ "${NON_SUCCESS_COUNT}" -gt 0 ]; then
            echo "::error::Backend commit ${FULL_SHA} has ${NON_SUCCESS_COUNT} pending or failed check run(s). Deployment rejected."
            echo "${STATUS_JSON}" | jq -r '.check_runs[] | "  - \(.name): status=\(.status), conclusion=\(.conclusion)"'
            exit 1
          fi

          # AC7 / AC8: Explicitly verify that the required 'backend-ci' check exists and succeeded
          BACKEND_CI_MATCH=$(echo "${STATUS_JSON}" | jq -r '[.check_runs[] | select((.name | test("backend-ci"; "i")) and .status == "completed" and .conclusion == "success")] | length')
          if [ "${BACKEND_CI_MATCH}" -eq 0 ]; then
            echo "::error::Required 'backend-ci' check run was not found or has not succeeded for commit ${FULL_SHA}. Deployment rejected per AC8."
            echo "Available check runs:"
            echo "${STATUS_JSON}" | jq -r '.check_runs[] | "  - \(.name): status=\(.status), conclusion=\(.conclusion)"'
            exit 1
          fi

          echo "✅ Verified required 'backend-ci' check and all ${SUCCESS_COUNT} check run(s) are completed and successful for commit ${FULL_SHA}."

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Authenticate Docker with Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check ECR image existence and push (Finding 2 / Finding 3: Tag Immutability & Rollback)
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'osms-backend' }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'false' }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

          echo "Checking if immutable tag ${IMAGE_TAG} already exists in ECR repository ${ECR_REPOSITORY}..."
          IMAGE_EXISTS="false"
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
            IMAGE_EXISTS="true"
            echo "Image ${IMAGE_URI} already exists in ECR."
          else
            echo "Image ${IMAGE_URI} does not exist in ECR yet."
          fi

          # AC2 & AC13: ECR Tag Immutability strictly forbids pushing an existing tag.
          # If the image exists, reuse it directly for App Runner deployment (supporting rollback & fast retries).
          if [ "${IMAGE_EXISTS}" = "true" ]; then
            if [ "${FORCE_DEPLOY}" = "true" ]; then
              echo "Notice: force_deploy requested. Reusing existing immutable image ${IMAGE_URI} from ECR to preserve tag immutability while forcing App Runner service rollout."
            else
              echo "Reusing existing verified image ${IMAGE_URI} from ECR."
            fi
            echo "image_reused=true" >> $GITHUB_OUTPUT
          else
            echo "Building backend Docker image..."
            docker build \
              --tag "${IMAGE_URI}" \
              --file infra/docker/backend/Dockerfile \
              backend

            echo "Pushing immutable image to Amazon ECR..."
            docker push "${IMAGE_URI}"
            echo "Image pushed successfully: ${IMAGE_URI}"
            echo "image_reused=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify Chatbot TTL index deployment dependency (Infra #7 / AC12 / Finding 1)
        env:
          STAGING_MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "${STAGING_MONGODB_URI}" ]; then
            echo "::error::Missing required secret MONGODB_URI for staging database verification. Deployment aborted safely per AC5/AC12."
            exit 1
          fi

          echo "Verifying Chatbot TTL index against staging MongoDB Atlas..."
          docker run --rm \
            -v "$(pwd)/infra/scripts:/scripts:ro" \
            -e OSMS_TARGET_DATABASE="osms-staging" \
            -e OSMS_CHATBOT_INDEX_MODE="verify" \
            mongo:8.0 \
            mongosh "${STAGING_MONGODB_URI}" --quiet --file /scripts/chatbot-usage-index.js
          echo "Chatbot TTL index verified successfully."

      - name: Roll out container image to AWS App Runner
        id: deploy
        env:
          APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          IMAGE_URI: ${{ steps.build-push.outputs.image_uri }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
          PORT: "5000"
          DEPLOY_TIMEOUT_SECONDS: "900"
        run: |
          node infra/scripts/deploy-apprunner.cjs

      - name: Probe HTTPS health and CORS configuration
        env:
          STAGING_SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN || 'https://osms-frontend-staging.vercel.app' }}
          HEALTH_CHECK_TIMEOUT_MS: "180000"
        run: |
          node infra/scripts/verify-staging-health.cjs

      - name: Publish deployment summary
        if: always()
        run: |
          echo "### 🚀 OSMS Backend Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Commit** | \`${{ steps.image-tag.outputs.commit_sha || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ steps.image-tag.outputs.tag || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECR Image URI** | \`${{ steps.build-push.outputs.image_uri || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Reused from ECR** | \`${{ steps.build-push.outputs.image_reused || 'false' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Runner Status** | **${{ steps.deploy.outputs.service_status || 'FAILED' }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Staging URL** | [${{ steps.deploy.outputs.service_url || 'N/A' }}](${{ steps.deploy.outputs.service_url || '#' }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Endpoint** | [${{ steps.deploy.outputs.service_url }}/api/health](${{ steps.deploy.outputs.service_url }}/api/health) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Result** | **${{ job.status }}** |" >> $GITHUB_STEP_SUMMARY
