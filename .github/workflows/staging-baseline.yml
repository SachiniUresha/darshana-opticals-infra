name: Staging baseline checks

on:
  push:
    branches: [develop]
    paths:
      - environments/staging.env.example
      - tests/staging-baseline.test.cjs
      - tests/backend-staging-deploy.test.cjs
      - tests/release-verification.test.cjs
      - docs/release/**
      - .github/workflows/staging-baseline.yml
      - .github/workflows/backend-staging-deploy.yml
      - .env.example
      - docs/staging-environment.md
      - docs/chatbot-usage-ttl.md
      - scripts/chatbot-usage-index.js
      - scripts/deploy-apprunner.cjs
      - scripts/verify-staging-health.cjs
  pull_request:
    branches: [develop]
    paths:
      - environments/staging.env.example
      - tests/staging-baseline.test.cjs
      - tests/backend-staging-deploy.test.cjs
      - tests/release-verification.test.cjs
      - docs/release/**
      - .github/workflows/staging-baseline.yml
      - .github/workflows/backend-staging-deploy.yml
      - .env.example
      - docs/staging-environment.md
      - docs/chatbot-usage-ttl.md
      - scripts/chatbot-usage-index.js
      - scripts/deploy-apprunner.cjs
      - scripts/verify-staging-health.cjs

permissions:
  contents: read

jobs:
  staging-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate staging configuration contract and deployment scripts
        run: |
          node --test tests/staging-baseline.test.cjs
          node --test tests/backend-staging-deploy.test.cjs
          node --test tests/release-verification.test.cjs
