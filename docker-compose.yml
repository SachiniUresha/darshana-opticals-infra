services:
  mongodb:
    image: mongo:latest
    container_name: osms-mongodb
    command: ["mongod", "--replSet", "osms-rs", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (error) {
          rs.initiate({_id:'osms-rs',members:[{_id:0,host:'mongodb:27017'}]}); }"
      interval: 5s
      timeout: 5s
      retries: 10

  chatbot-usage-index:
    image: mongo:8.0
    restart: "no"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/osms-dev?replicaSet=osms-rs}
      OSMS_TARGET_DATABASE: ${MONGODB_DATABASE:-osms-dev}
      OSMS_CHATBOT_INDEX_MODE: apply
    volumes:
      - ./scripts/chatbot-usage-index.js:/scripts/chatbot-usage-index.js:ro
    command:
      - sh
      - -c
      - exec mongosh "$$MONGODB_URI" --quiet --file /scripts/chatbot-usage-index.js
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend/Dockerfile
    container_name: osms-backend
    init: true
    command: ["npm", "run", "dev"]
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-5000}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/osms-dev?replicaSet=osms-rs}
      - JWT_SECRET=${JWT_SECRET:-osms-dev-jwt-secret-key-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      chatbot-usage-index:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/frontend/Dockerfile
    container_name: osms-frontend
    init: true
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000/api}
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
